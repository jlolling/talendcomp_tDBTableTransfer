# PostgreSQL test database for the table transfer components
# start: docker compose -f docker/docker-compose.yml up -d
# reset: docker compose -f docker/docker-compose.yml down -v && docker compose -f docker/docker-compose.yml up -d
services:
  postgres:
    image: postgres:17
    container_name: tabletransfer-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - ./init:/docker-entrypoint-initdb.d:ro
      - tabletransfer-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 2s
      timeout: 5s
      retries: 30

volumes:
  tabletransfer-pgdata:
